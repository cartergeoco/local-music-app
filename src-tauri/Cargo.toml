[package]
name = "local-music-app"
version = "0.1.0"
description = "Local music library manager"
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "local_music_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
lofty = "0.25.5"
walkdir = "2.5.0"
blake3 = "1.8.7"
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "3.5.2", features = ["json"] }
tauri-plugin-dialog = "2.8.4"
id3 = "1.17.3"

# Image decoding and hashing are unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

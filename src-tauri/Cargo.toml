[package]
name = "local-music-app"
version = "0.1.0"
description = "Local music library manager"
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "local_music_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
